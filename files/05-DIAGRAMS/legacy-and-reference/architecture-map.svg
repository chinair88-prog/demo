<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111c34"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#7fa7ff"/></marker></defs>
<style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#eef4ff}.sub{font:16px Inter,Segoe UI,sans-serif;fill:#9fb0c9}.box{stroke:#6f91d8;stroke-width:1.5;rx:16;filter:url(#shadow)}.label{font:700 18px Inter,Segoe UI,sans-serif;fill:#f3f7ff}.small{font:14px Inter,Segoe UI,sans-serif;fill:#b8c5d9}.edge{stroke:#7fa7ff;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge2{stroke:#63d3c4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="60" y="62" class="title">GTOS Architecture Map</text><text x="60" y="92" class="sub">From foundational theory to operating evidence</text><rect class="box" x="65" y="145" width="285" height="125" fill="#2b2148"/><text x="83" y="177" class="label">Reference Theory</text><text x="83" y="202" class="small">Ontology, epistemology, authority,</text><text x="83" y="222" class="small">causality</text><rect class="box" x="400" y="145" width="285" height="125" fill="#3c1f2c"/><text x="418" y="177" class="label">Canon</text><text x="418" y="202" class="small">Foundational architectural axioms</text><rect class="box" x="735" y="145" width="285" height="125" fill="#3a2f18"/><text x="753" y="177" class="label">Constitution</text><text x="753" y="202" class="small">Authority, governance, conformance</text><rect class="box" x="1070" y="145" width="285" height="125" fill="#10343b"/><text x="1088" y="177" class="label">Business Architecture</text><text x="1088" y="202" class="small">Capabilities, value streams, decisions</text><rect class="box" x="65" y="350" width="285" height="125" fill="#162846"/><text x="83" y="382" class="label">Domain Architecture</text><text x="83" y="407" class="small">Ownership, aggregates, contracts</text><rect class="box" x="400" y="350" width="285" height="125" fill="#2b2148"/><text x="418" y="382" class="label">AI Architecture</text><text x="418" y="407" class="small">Evidence-aware agents and decisions</text><rect class="box" x="735" y="350" width="285" height="125" fill="#17372b"/><text x="753" y="382" class="label">Data Architecture</text><text x="753" y="407" class="small">Time, lineage, quality, retention</text><rect class="box" x="1070" y="350" width="285" height="125" fill="#162846"/><text x="1088" y="382" class="label">Platform Architecture</text><text x="1088" y="407" class="small">Shared governed capabilities</text><rect class="box" x="65" y="555" width="285" height="125" fill="#10343b"/><text x="83" y="587" class="label">Infrastructure</text><text x="83" y="612" class="small">Resilience and execution environment</text><rect class="box" x="400" y="555" width="285" height="125" fill="#3c1f2c"/><text x="418" y="587" class="label">Security</text><text x="418" y="612" class="small">Identity, policy, trust, evidence</text><rect class="box" x="735" y="555" width="285" height="125" fill="#3a2f18"/><text x="753" y="587" class="label">Engineering</text><text x="753" y="612" class="small">Code, contracts, tests, delivery</text><rect class="box" x="1070" y="555" width="285" height="125" fill="#17372b"/><text x="1088" y="587" class="label">Operations</text><text x="1088" y="612" class="small">SLOs, incidents, recovery</text><path class="edge" d="M 350 207.5 C 350 207.5, 400 207.5, 400 207.5"/><path class="edge" d="M 685 207.5 C 685 207.5, 735 207.5, 735 207.5"/><path class="edge" d="M 1020 207.5 C 1020 207.5, 1070 207.5, 1070 207.5"/><path class="edge" d="M 1212.5 270 C 1212.5 310.0, 207.5 310.0, 207.5 350"/><path class="edge" d="M 350 412.5 C 350 412.5, 400 412.5, 400 412.5"/><path class="edge" d="M 685 412.5 C 685 412.5, 735 412.5, 735 412.5"/><path class="edge" d="M 1020 412.5 C 1020 412.5, 1070 412.5, 1070 412.5"/><path class="edge" d="M 1212.5 475 C 1212.5 515.0, 207.5 515.0, 207.5 555"/><path class="edge" d="M 350 617.5 C 350 617.5, 400 617.5, 400 617.5"/><path class="edge" d="M 685 617.5 C 685 617.5, 735 617.5, 735 617.5"/><path class="edge" d="M 1020 617.5 C 1020 617.5, 1070 617.5, 1070 617.5"/></svg>
