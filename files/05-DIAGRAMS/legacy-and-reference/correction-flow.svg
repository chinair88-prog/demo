<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111c34"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#7fa7ff"/></marker></defs>
<style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#eef4ff}.sub{font:16px Inter,Segoe UI,sans-serif;fill:#9fb0c9}.box{stroke:#6f91d8;stroke-width:1.5;rx:16;filter:url(#shadow)}.label{font:700 18px Inter,Segoe UI,sans-serif;fill:#f3f7ff}.small{font:14px Inter,Segoe UI,sans-serif;fill:#b8c5d9}.edge{stroke:#7fa7ff;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge2{stroke:#63d3c4;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="60" y="62" class="title">Correction Propagation</text><text x="60" y="92" class="sub">Correct history without rewriting it</text><rect class="box" x="55" y="260" width="190" height="110" fill="#162846"/><text x="73" y="292" class="label">Identify</text><text x="73" y="317" class="small">Subject, event, impact, authority</text><rect class="box" x="285" y="260" width="190" height="110" fill="#2b2148"/><text x="303" y="292" class="label">Preserve</text><text x="303" y="317" class="small">Evidence, versions, times, lineage</text><rect class="box" x="515" y="260" width="190" height="110" fill="#3a2f18"/><text x="533" y="292" class="label">Assess</text><text x="533" y="317" class="small">Affected claims, decisions, outcomes</text><rect class="box" x="745" y="260" width="190" height="110" fill="#3c1f2c"/><text x="763" y="292" class="label">Decide</text><text x="763" y="317" class="small">Correct, appeal, notify, remediate</text><rect class="box" x="975" y="260" width="190" height="110" fill="#10343b"/><text x="993" y="292" class="label">Execute</text><text x="993" y="317" class="small">Apply authorized remediation</text><rect class="box" x="1205" y="260" width="150" height="110" fill="#17372b"/><text x="1223" y="292" class="label">Verify</text><text x="1223" y="317" class="small">Reconcile and close</text><path class="edge" d="M 245 315.0 C 245 315.0, 285 315.0, 285 315.0"/><path class="edge" d="M 475 315.0 C 475 315.0, 515 315.0, 515 315.0"/><path class="edge" d="M 705 315.0 C 705 315.0, 745 315.0, 745 315.0"/><path class="edge" d="M 935 315.0 C 935 315.0, 975 315.0, 975 315.0"/><path class="edge" d="M 1165 315.0 C 1165 315.0, 1205 315.0, 1205 315.0"/></svg>
